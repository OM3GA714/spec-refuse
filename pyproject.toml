[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-refuse"
version = "0.1.0"
description = "Fail-closed gate for an absent product specification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "OM3GA714" }]
dependencies = []

[project.scripts]
spec-refuse = "spec_refuse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
